<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0b1120;#020617" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="45%" stop-color="#312e81">
        <animate attributeName="stop-color" values="#312e81;#4c1d95;#312e81" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#9333ea;#7c3aed" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#22d3ee;#06b6d4" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe">
        <animate attributeName="stop-color" values="#e0f2fe;#a5f3fc;#e0f2fe" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#c4b5fd;#67e8f9" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#e0f2fe">
        <animate attributeName="stop-color" values="#e0f2fe;#a5f3fc;#e0f2fe" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" /><feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="bannerClip"><rect x="0" y="0" width="1200" height="300" /></clipPath>
    <clipPath id="clipA"><rect x="72" y="160" width="0" height="34">
      <animate attributeName="width" dur="12s" begin="0s" repeatCount="indefinite"
        keyTimes="0;0.05;0.2833;0.3333;1" values="0;330;330;0;0" />
    </rect></clipPath>
    <clipPath id="clipB"><rect x="72" y="160" width="0" height="34">
      <animate attributeName="width" dur="12s" begin="0s" repeatCount="indefinite"
        keyTimes="0;0.3333;0.3833;0.6167;0.6667;1" values="0;0;310;310;0;0" />
    </rect></clipPath>
    <clipPath id="clipC"><rect x="72" y="160" width="0" height="34">
      <animate attributeName="width" dur="12s" begin="0s" repeatCount="indefinite"
        keyTimes="0;0.6667;0.7167;0.9667;1" values="0;0;350;350;0" />
    </rect></clipPath>

    <style>
      .particle { animation: floatUp linear infinite; }
      @keyframes floatUp {
        0%   { transform: translateY(0); opacity: 0; }
        10%  { opacity: 0.9; } 90% { opacity: 0.5; }
        100% { transform: translateY(-260px); opacity: 0; }
      }
      .gridline { animation: pulseGrid 6s ease-in-out infinite; }
      @keyframes pulseGrid { 0%,100% { opacity: 0.04; } 50% { opacity: 0.12; } }

      .name-text { animation: softGlow 3s ease-in-out infinite; }
      @keyframes softGlow {
        0%,100% { filter: drop-shadow(0 0 6px rgba(103,232,249,0.55)); }
        50%     { filter: drop-shadow(0 0 20px rgba(196,181,253,0.9)); }
      }

      .orbit { transform-origin: 1050px 100px; animation: spin linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .orbit-slow { animation-duration: 14s; }
      .orbit-mid  { animation-duration: 9s; }
      .orbit-fast { animation-duration: 6s; }

      .shine { animation: sweep 5s linear infinite; }
      @keyframes sweep {
        0%   { transform: translateX(-500px) rotate(18deg); }
        100% { transform: translateX(900px) rotate(18deg); }
      }

      .chip { animation: chipFloat 3s ease-in-out infinite; }
      @keyframes chipFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .chip-border { animation: chipGlow 3s ease-in-out infinite; }
      @keyframes chipGlow { 0%,100% { stroke-opacity: 0.5; } 50% { stroke-opacity: 1; } }

      .dot-pulse { animation: dotPulse 2.4s ease-in-out infinite; }
      @keyframes dotPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

      .underline { animation: underlineGrow 4s ease-in-out infinite; }
      @keyframes underlineGrow {
        0%   { transform: scaleX(0); }
        30%  { transform: scaleX(1); }
        70%  { transform: scaleX(1); }
        100% { transform: scaleX(0); }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)" />

  <g class="gridline" stroke="#67e8f9" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="420" y1="0" x2="420" y2="300" />
    <line x1="880" y1="0" x2="880" y2="300" />
    <line x1="1080" y1="0" x2="1080" y2="300" />
  </g>

  <g clip-path="url(#bannerClip)">
    <rect class="shine" x="0" y="-100" width="140" height="520" fill="url(#shineGrad)" />
  </g>

  <g fill="#a5f3fc">
    <circle class="particle" cx="80"  cy="280" r="2"   style="animation-duration:7s; animation-delay:0s" />
    <circle class="particle" cx="160" cy="290" r="1.5" style="animation-duration:9s; animation-delay:1s" />
    <circle class="particle" cx="620" cy="290" r="1.8" style="animation-duration:7.5s; animation-delay:1.5s" />
    <circle class="particle" cx="720" cy="275" r="2.2" style="animation-duration:9.5s; animation-delay:2.5s" />
    <circle class="particle" cx="900" cy="290" r="1.5" style="animation-duration:6.5s; animation-delay:0.8s" />
    <circle class="particle" cx="1150" cy="280" r="2"  style="animation-duration:8.5s; animation-delay:1.8s" />
    <circle class="particle" cx="30"  cy="285" r="1.3" style="animation-duration:9.2s; animation-delay:3.5s" />
  </g>

  <g transform="translate(30,26)">
    <circle class="dot-pulse" cx="0"  cy="0" r="5.5" fill="#f87171" style="animation-delay:0s" />
    <circle class="dot-pulse" cx="22" cy="0" r="5.5" fill="#fbbf24" style="animation-delay:0.4s" />
    <circle class="dot-pulse" cx="44" cy="0" r="5.5" fill="#34d399" style="animation-delay:0.8s" />
    <text x="66" y="5" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#94a3b8">~/portfolio — zsh</text>
  </g>

  <g>
    <circle cx="1050" cy="100" r="48" fill="url(#nodeGlow)" />
    <circle cx="1050" cy="100" r="4" fill="#e0f2fe" />
    <g class="orbit orbit-slow"><circle cx="1050" cy="52" r="5" fill="#67e8f9" filter="url(#glow)" /></g>
    <g class="orbit orbit-mid"><circle cx="1098" cy="100" r="4" fill="#c4b5fd" filter="url(#glow)" /></g>
    <g class="orbit orbit-fast"><circle cx="1050" cy="142" r="3.5" fill="#22d3ee" filter="url(#glow)" /></g>
  </g>

  <text x="70" y="128" font-family="'Segoe UI', Verdana, sans-serif" font-size="54" font-weight="700"
        fill="url(#textGrad)" class="name-text">Arkaj Kamal</text>
  <rect x="72" y="140" width="330" height="3" rx="1.5" fill="url(#textGrad)" class="underline" style="transform-origin:72px 141px" />

  <g font-family="'Fira Code','Consolas',monospace" font-size="24" font-weight="500" fill="#bae6fd">
    <text x="72" y="184" clip-path="url(#clipA)">Python &amp; Django Developer▌</text>
    <text x="72" y="184" clip-path="url(#clipB)">Full-Stack Web Developer▌</text>
    <text x="72" y="184" clip-path="url(#clipC)">Building Scalable Web Apps▌</text>
  </g>

  <g font-family="'Segoe UI', Verdana, sans-serif" font-size="15" font-weight="600">
    <g class="chip" style="animation-delay:0s">
      <rect x="72" y="222" width="104" height="34" rx="17" fill="#0f172a" fill-opacity="0.55"
            stroke="#67e8f9" stroke-width="1.3" class="chip-border" />
      <text x="124" y="244" fill="#e0f2fe" text-anchor="middle">Python</text>
    </g>
    <g class="chip" style="animation-delay:0.3s">
      <rect x="188" y="222" width="104" height="34" rx="17" fill="#0f172a" fill-opacity="0.55"
            stroke="#c4b5fd" stroke-width="1.3" class="chip-border" />
      <text x="240" y="244" fill="#e0f2fe" text-anchor="middle">Django</text>
    </g>
    <g class="chip" style="animation-delay:0.6s">
      <rect x="304" y="222" width="136" height="34" rx="17" fill="#0f172a" fill-opacity="0.55"
            stroke="#67e8f9" stroke-width="1.3" class="chip-border" />
      <text x="372" y="244" fill="#e0f2fe" text-anchor="middle">JavaScript</text>
    </g>
    <g class="chip" style="animation-delay:0.9s">
      <rect x="452" y="222" width="96" height="34" rx="17" fill="#0f172a" fill-opacity="0.55"
            stroke="#c4b5fd" stroke-width="1.3" class="chip-border" />
      <text x="500" y="244" fill="#e0f2fe" text-anchor="middle">React</text>
    </g>
  </g>

  <path fill="url(#waveGrad1)" fill-opacity="0.55">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,270 C200,235 400,300 600,270 C800,240 1000,300 1200,270 L1200,300 L0,300 Z;
              M0,280 C200,310 400,245 600,280 C800,310 1000,250 1200,280 L1200,300 L0,300 Z;
              M0,270 C200,235 400,300 600,270 C800,240 1000,300 1200,270 L1200,300 L0,300 Z" />
  </path>
  <path fill="url(#waveGrad2)" fill-opacity="0.5">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
      values="M0,290 C300,260 600,315 900,285 C1050,270 1150,300 1200,288 L1200,300 L0,300 Z;
              M0,285 C300,310 600,260 900,300 C1050,315 1150,275 1200,292 L1200,300 L0,300 Z;
              M0,290 C300,260 600,315 900,285 C1050,270 1150,300 1200,288 L1200,300 L0,300 Z" />
  </path>
</svg>
